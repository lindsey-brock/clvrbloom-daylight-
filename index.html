<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ClvrBloom, a brand and web studio. Every great brand starts as a wish.">
<title>ClvrBloom Gallery Daylight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Grenze+Gotisch:wght@700;800&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: a two-screen track. Screen one is the firefly-lit hero with the star-seeded dandelion; screen two is the four-step wish journey the last seed flies into. */
:root{
  --night:#FCEBD6;
  --panel:#FFF7EC;
  --ink:#2F1B10;
  --ink-soft:#3E2F23;
  --muted:#7A6553;
  --rule:rgba(47,27,16,.28);
  --gold:#0A2FBD;
  --gold-rgb:10,47,189;
  --accent:#FE7539;
  --ln:47,27,16;
  --btn-bg:transparent;
  --card:rgba(255,248,238,.92);
  --logo:'Forge Garage Blackletter','Grenze Gotisch','UnifrakturCook',Georgia,serif;
  --display:'Newsreader','Iowan Old Style',Georgia,serif;
  --body:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  color-scheme: light;
}
html,body{background:var(--night);color:var(--ink)}
body{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));font-family:var(--body)}
.page{position:relative;overflow:hidden;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));height:max(680px, 100svh);background:var(--night)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#sky{z-index:0}#fx{z-index:1}
.track{position:relative;z-index:2;display:flex;width:200%;height:100%;transition:transform 1.6s cubic-bezier(.65,0,.35,1)}
.pane{width:50%;height:100%;position:relative;min-width:0;box-sizing:border-box}
.gutter{padding-inline:max(16px, env(safe-area-inset-left, 0px), 4.2vw) max(16px, env(safe-area-inset-right, 0px), 2.5vw)}
@media (prefers-reduced-motion: reduce){.track{transition:none}}

/* hero */
.hero{display:flex;flex-direction:column;pointer-events:none}
.hero a,.hero button{pointer-events:auto}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px 32px;flex-wrap:wrap;padding-block:22px 20px;border-bottom:1px solid var(--rule)}
.logo{display:inline-flex;align-items:center;gap:.08em;font-family:var(--logo);font-weight:800;font-size:38px;color:var(--ink);text-decoration:none;line-height:1;text-shadow:none}
.bloom{width:1.12em;height:1.4em;overflow:visible;margin-top:.12em;filter:none;color:var(--ink);transition:transform .8s cubic-bezier(.22,1,.36,1)}
a.logo:hover .bloom{transform:rotate(25deg)}
.bloom .tip{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.bloom .tip{animation:none;opacity:.9}.bloom{transition:none}}
.links{display:flex;align-items:center;flex-wrap:wrap;gap:8px clamp(20px,4vw,64px);font-size:16px;letter-spacing:.02em}
.links a{color:var(--ink);text-decoration:none;padding:8px 0}
.links a:hover{color:var(--gold)}
.links .cta{border:1.5px solid rgba(var(--ln),.7);border-radius:3px;padding:11px 22px}
.links .cta:hover{background:var(--ink);color:var(--night)}
.copy{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;max-width:min(640px, 52vw);padding-block:28px 56px}
.eyebrow{margin:0;font-weight:500;font-size:clamp(13px,1.2vw,17px);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(50px,6.4vw,112px);line-height:.98;letter-spacing:-.04em;text-wrap:balance;text-shadow:none}
h1 em{display:block;font-style:italic;color:var(--accent);text-shadow:none}
.lede{margin:0;font-weight:300;font-size:clamp(18px,1.6vw,24px);line-height:1.45;letter-spacing:.01em;max-width:30ch;color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px 52px;margin-top:6px}
.btn{font:inherit;font-size:17px;font-weight:500;color:var(--ink);background:var(--btn-bg);cursor:pointer;border:1.5px solid var(--ink);border-bottom-width:6px;border-radius:2px;padding:16px 26px 13px;min-height:52px;transition:background .25s,color .25s,box-shadow .25s,transform .15s}
.btn:hover{background:var(--ink);color:var(--night);box-shadow:none}
.btn:active{transform:translateY(2px)}
.link{font-size:17px;font-weight:500;color:var(--ink);text-decoration:none;border-bottom:1.5px dashed var(--ink);padding-bottom:4px}
.link:hover{color:var(--gold);border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

/* onboarding */
.onb{display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(var(--ln),.25) transparent}
.onb-head{display:flex;align-items:center;gap:18px;padding-block:22px 20px;border-bottom:1px solid var(--rule)}
.onb-head .logo{font-size:30px}
.back{font:inherit;font-size:15px;color:var(--ink);background:none;border:1px solid rgba(var(--ln),.28);border-radius:999px;padding:10px 18px 10px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.back:hover{border-color:rgba(var(--ln),.6)}
.onb-body{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:0 72px;text-align:center}
.spot-area{width:100%;height:64px;position:relative;flex:none}
#spot{position:absolute;left:50%;top:45%;width:1px;height:1px}
.step{width:100%;max-width:760px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:26px;animation:stepIn .6s cubic-bezier(.22,1,.36,1) both}
@keyframes stepIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.step{animation:none}}
.step .eyebrow{font-size:13px}
.big{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(32px,3.4vw,48px);line-height:1.15;letter-spacing:-.02em}
.big em{font-style:italic;color:var(--gold)}
.sentence{width:100%;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:6px 16px}
.sentence .big{white-space:nowrap}
.select{position:relative;flex:1 1 260px;min-width:0;max-width:440px;text-align:left}
.pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(32px,3.4vw,48px);line-height:1.5;color:var(--gold);background:transparent;border:none;border-bottom:1px solid rgba(var(--ln),.4);border-radius:0;padding:0 4px 6px 0;cursor:pointer;text-align:left}
.pick-text{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick svg{flex:none;transition:transform .2s}
.pick[aria-expanded="true"] svg{transform:rotate(180deg)}
.pop{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:5;background:var(--panel);border:1px solid rgba(var(--ln),.14);border-radius:16px;box-shadow:0 24px 60px rgba(47,27,16,.18);overflow:hidden}
.pop-search{padding:12px;border-bottom:1px solid rgba(var(--ln),.1)}
.field{width:100%;box-sizing:border-box;font:inherit;font-size:15px;color:var(--ink);background:rgba(var(--ln),.06);border:1px solid rgba(var(--ln),.16);border-radius:10px;padding:10px 12px;min-height:44px}
.field::placeholder{color:var(--muted)}
.list{max-height:300px;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:rgba(var(--ln),.25) transparent}
.glabel{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 12px 6px}
.opt{display:block;width:100%;box-sizing:border-box;text-align:left;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:none;border-radius:8px;padding:11px 12px;min-height:44px;cursor:pointer}
.opt:hover,.opt:focus-visible{background:rgba(var(--ln),.08)}
.opt.sel{color:var(--gold);background:rgba(var(--gold-rgb),.12)}
.nomatch{margin:0;padding:12px 12px 4px;font-size:14px;line-height:1.5;color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{margin:0;font-size:17px;line-height:1.6;color:var(--ink-soft);max-width:460px}
.note{margin:0;font-family:var(--display);font-style:italic;font-size:17px;line-height:1.5;color:var(--gold)}
.primary{font:inherit;font-size:16px;font-weight:600;cursor:pointer;border:none;border-radius:999px;padding:16px 32px;min-height:52px;background:var(--gold);color:var(--night);box-shadow:none;transition:box-shadow .25s,transform .15s}
.primary:hover{box-shadow:0 6px 18px rgba(10,47,189,.25)}
.primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.line{flex:1 1 240px;min-width:0;max-width:380px;box-sizing:border-box;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(32px,3.4vw,48px);line-height:1.5;color:var(--gold);background:transparent;border:none;border-bottom:1px solid rgba(var(--ln),.4);border-radius:0;padding:0 0 6px;outline-offset:6px}
.line::placeholder{color:rgba(var(--gold-rgb),.4)}
.line:disabled{opacity:.35}
.check{display:inline-flex;align-items:center;gap:12px;font-size:15px;cursor:pointer;min-height:44px}
.check input{width:20px;height:20px;margin:0;accent-color:var(--gold);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:860px}
.chip{font:inherit;font-size:14px;color:var(--ink);background:var(--btn-bg);border:1px solid rgba(var(--ln),.28);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:rgba(var(--ln),.6)}
.chip[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:rgba(var(--gold-rgb),.12)}
.other{width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px;text-align:left}
.other label{font-size:14px;color:var(--ink-soft)}
.card{width:100%;max-width:640px;box-sizing:border-box;text-align:left;background:var(--card);backdrop-filter:blur(6px);border:1px solid rgba(var(--ln),.12);border-radius:20px;padding:18px 26px 20px}
.card ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));column-gap:28px}
.card li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid rgba(var(--ln),.08);font-size:15px}
.price{font-family:var(--display);font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
.saving{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-family:var(--display);font-style:italic;font-size:16px;color:var(--gold)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:12px;margin-top:12px;border-top:1px solid rgba(var(--ln),.2)}
.total span:first-child{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.total span:last-child{font-family:var(--display);font-weight:300;font-size:34px;line-height:1.1;color:var(--gold);font-variant-numeric:tabular-nums}
.fine{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 20px}
.textlink{font:inherit;font-size:15px;color:var(--ink);background:none;border:none;text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:44px;padding:0 6px}
.progress{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:36px;font-size:14px;color:var(--muted)}
.bar{width:240px;height:3px;border-radius:3px;background:rgba(var(--ln),.16);overflow:hidden}
#bar{height:100%;width:25%;background:var(--gold);transition:width .6s cubic-bezier(.22,1,.36,1)}

@media (max-width:859px){
  .page{height:max(980px, 100svh)}
  .copy{justify-content:flex-start;max-width:100%;padding-top:44px}
  .links{font-size:15px}
}
@media (max-width:520px){ .links a:not(.cta){display:none} .logo{font-size:30px} .sentence .big{white-space:normal} }
</style>
<style>html{color-scheme:light}body{margin:0;background:#FCEBD6}[hidden]{display:none!important}</style>
</head>
<body>
<div class="page" id="page">
  <canvas id="sky" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="track" id="track">

    <div class="pane hero gutter" id="hero">
      <nav aria-label="Main">
        <a class="logo" href="#" aria-label="ClvrBloom"><span aria-hidden="true">Clvr</span><svg class="bloom" aria-hidden="true"></svg></a>
        <div class="links">
          <a href="#">Work</a>
          <a href="#">About</a>
          <a href="#">Approach</a>
          <a class="cta" href="#">Start a project →</a>
        </div>
      </nav>
      <section class="copy">
        <p class="eyebrow">Brand + Web Studio</p>
        <h1>Beautiful ideas <em>going places.</em></h1>
        <p class="lede">Every great brand starts as a wish. Make yours, and we'll help it grow into something people remember.</p>
        <div class="actions">
          <button class="btn" id="wish" type="button">· Make a wish ·</button>
          <a class="link" href="#">See our work</a>
        </div>
      </section>
    </div>

    <div class="pane onb" id="onb" aria-hidden="true" style="visibility:hidden" inert>
      <div class="onb-head gutter">
        <button type="button" class="back" id="back">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8L10 13"/></svg>
          Back
        </button>
        <span class="logo" role="img" aria-label="ClvrBloom"><span aria-hidden="true">Clvr</span><svg class="bloom" aria-hidden="true"></svg></span>
      </div>
      <section class="onb-body gutter">
        <div class="spot-area" aria-hidden="true"><div id="spot"></div></div>
        <div id="stepHost" style="width:100%;display:flex;justify-content:center"></div>
        <div class="progress">
          <span id="stepNum">Step 1 of 4</span>
          <div class="bar" role="progressbar" aria-label="Onboarding progress" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1" id="pbar"><div id="bar"></div></div>
        </div>
      </section>
    </div>

  </div>
</div>

<script>
(function(){
  const page=document.getElementById('page'), sky=document.getElementById('sky'), fx=document.getElementById('fx');
  const sctx=sky.getContext('2d'), ctx=fx.getContext('2d');
  const track=document.getElementById('track'), heroPane=document.getElementById('hero'), onbPane=document.getElementById('onb');
  const wishBtn=document.getElementById('wish'), spotEl=document.getElementById('spot');
  const reduced=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v, ease3=x=>1-Math.pow(1-x,3), rnd=(a,b)=>a+Math.random()*(b-a);
  const DUR=reduced?1:1600;
  // colour theme for this version
  const TH={"light": true, "spots": true, "pal": [[255, 90, 165], [255, 214, 82], [254, 117, 57], [244, 200, 78], [240, 79, 135], [255, 170, 110], [255, 246, 225]], "fly": [[244, 200, 78], [254, 117, 57], [240, 79, 135], [154, 130, 240]], "sky": null, "neb": null, "nebA": 0, "dust": null, "horizon": null, "grass": ["#8E9C63", "#657A45"], "stem": {"halo": null, "haloA": 0, "body": "101,122,69", "rim": "244,200,78", "rimA": 0.75}, "hair": "255,250,240", "occ": "10,47,189", "halo": null, "orb": ["255,244,220", "154,130,240", "255,236,200", "154,130,240"], "seedDark": "47,27,16"};
  const ADD=TH.light?'source-over':'lighter';

  // star colours for the seed tips and their dust
  const PAL=TH.pal;
  const AMBER=TH.fly;

  // ---------- sprites ----------
  function sprite(size,stops){ const cv=document.createElement('canvas'); cv.width=cv.height=size; const g=cv.getContext('2d');
    const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2); stops.forEach(([o,c])=>gr.addColorStop(o,c)); g.fillStyle=gr; g.fillRect(0,0,size,size); return cv; }
  const glowSprite=c=>sprite(64,[[0,'rgba(255,255,255,1)'],[.12,`rgba(${c},.95)`],[.38,`rgba(${c},.32)`],[1,`rgba(${c},0)`]]);
  function starSprite(c){
    const s=128,h=s/2,cv=document.createElement('canvas'); cv.width=cv.height=s; const g=cv.getContext('2d');
    const gr=g.createRadialGradient(h,h,0,h,h,h*.55); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.18,`rgba(${c},.8)`); gr.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=gr; g.fillRect(0,0,s,s); g.globalCompositeOperation='lighter';
    for(const [w,len,a,off] of [[2.2,h,.9,0],[1.2,h*.55,.6,Math.PI/4]]) for(let r=0;r<2;r++){
      g.save(); g.translate(h,h); g.rotate(off+r*Math.PI/2);
      const lg=g.createLinearGradient(-len,0,len,0); lg.addColorStop(0,`rgba(${c},0)`); lg.addColorStop(.5,`rgba(255,255,255,${a})`); lg.addColorStop(1,`rgba(${c},0)`);
      g.fillStyle=lg; g.beginPath(); g.moveTo(-len,0); g.lineTo(0,-w); g.lineTo(len,0); g.lineTo(0,w); g.fill(); g.restore();
    }
    return cv;
  }
  const GLOW=PAL.map(c=>glowSprite(c.join(','))), STAR=PAL.map(c=>starSprite(c.join(','))), ORBG=glowSprite('170,195,255');
  // sun spots: soft round dapples of light with a warm bright centre, instead of star sparkles
  const SPOT=PAL.map(c=>sprite(64,[[0,'rgba(255,250,236,.95)'],[.3,`rgba(${c.join(',')},.8)`],[.62,`rgba(${c.join(',')},.34)`],[1,`rgba(${c.join(',')},0)`]]));
  const FLY=AMBER.map(c=>sprite(64,[[0,'rgba(255,246,200,1)'],[.14,`rgba(${c},.95)`],[.4,`rgba(${c},.28)`],[1,`rgba(${c},0)`]]));
  const BOKEH=AMBER.map(c=>sprite(96,[[0,`rgba(${c},.55)`],[.62,`rgba(${c},.42)`],[.8,`rgba(${c},.16)`],[1,`rgba(${c},0)`]]));

  // ---------- seeds: Fibonacci sphere, stalk + 14-hair pappus (from the original) ----------
  const N=1400, F=14, ga=Math.PI*(3-Math.sqrt(5)), seeds=[];
  for(let i=0;i<N;i++){
    const y=1-2*(i+.5)/N, r=Math.sqrt(1-y*y), th=ga*i;
    let d=[Math.cos(th)*r+rnd(-.03,.03), y+rnd(-.03,.03), Math.sin(th)*r+rnd(-.03,.03)]; const dl=Math.hypot(...d); d=d.map(v=>v/dl);
    const a=Math.abs(d[1])<.9?[0,1,0]:[1,0,0];
    let u=[d[1]*a[2]-d[2]*a[1], d[2]*a[0]-d[0]*a[2], d[0]*a[1]-d[1]*a[0]]; const ul=Math.hypot(...u); u=u.map(v=>v/ul);
    const v=[d[1]*u[2]-d[2]*u[1], d[2]*u[0]-d[0]*u[2], d[0]*u[1]-d[1]*u[0]];
    const fil=[]; for(let k=0;k<F;k++){const ph=k/F*Math.PI*2+Math.random()*.45; fil.push(Math.cos(ph),Math.sin(ph),.62+Math.random()*.72);}
    const jt=.42*Math.sqrt(Math.random()), ja=Math.random()*6.2832;
    let an=[0,1,2].map(j=>d[j]+jt*(Math.cos(ja)*u[j]+Math.sin(ja)*v[j])); const anl=Math.hypot(...an); an=an.map(q=>q/anl);
    seeds.push({d,u,v,a:an,fil,len:.88+Math.random()*.18,open:.88+Math.random()*.26,delay:Math.random()*.4,gone:false,pend:false,regrow:0,born:-1e9,
      col:(Math.random()*PAL.length)|0, ph:Math.random()*6.28, tw:rnd(1.2,3.4), lit:Math.random()<.1, star:false});
  }
  const rot=new Float32Array(N*12), bk=new Uint8Array(N), hubX=new Float32Array(N), hubY=new Float32Array(N), hubE=new Float32Array(N);

  let W=0,H=0,dpr=1,G={}, t0=performance.now(), last=t0, gust=0, mx=null;
  let free=[], dust=[], pending=[], wished=false, nextAmbient=6500, busy=false, landing=null;
  // the head opens slowly on a stem that is already there, as in the original
  const SWELL=0;
  let swellAt=-1e9, explodeAt=reduced?-1e9:300, swellFrom=1, exploded=true;
  for(const s of seeds) s.born=explodeAt;
  let slideFrom=0, slideTo=null, slideT0=0;
  let stars=[], flies=[], grassBack=[], grassFront=[];

  function makeGrass(n,lo,hi,col){
    const out=[]; for(let i=0;i<n;i++){ const right=Math.random()<.62, x=right?rnd(W*.4,W*1.03):rnd(-.03*W,W*.4);
      out.push({x,h:rnd(lo,hi)*H*(right?1:.7),lean:rnd(-.28,.28),w:rnd(2.5,6.5),ph:Math.random()*6.28}); }
    out.col=col; return out;
  }
  function resize(){

  // static sky: deep royal blue, low warm haze over the meadow, faint distant stars
  function paintSky(){
    const g=sctx; g.setTransform(dpr,0,0,dpr,0,0);
    const neb=(x,y,r,c,a)=>{const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,`rgba(${c},${a})`); gr.addColorStop(1,`rgba(${c},0)`); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);};

      g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--night').trim()||'#FCEBD6'; g.fillRect(0,0,W,H);

    }

    g.fillStyle=sun; g.fillRect(0,H*.7,W,H*.3);

  // her Ultramarine and Persimmon suns, with a printed grain; drawn into their own canvas

      const X0=Math.max(0,Math.floor((cx-r-2)*dpr)), Y0=Math.max(0,Math.floor((cy-r-2)*dpr));
      const X1=Math.min(sunCv.width,Math.ceil((cx+r+2)*dpr)), Y1=Math.min(sunCv.height,Math.ceil((cy+r+2)*dpr));
      if(X1<=X0||Y1<=Y0) return;

  // ---------- screen slide (same easing as the CSS track) ----------

  function slide(to,t){ slideFrom=sp(t); slideTo=to; slideT0=t; }
  function measureLanding(){
    const pr=page.getBoundingClientRect(), r=spotEl.getBoundingClientRect();
    return [r.left-pr.left-W*(1-sp(tNow())), r.top-pr.top];
  }
  function show(el,on){ el.style.visibility=on?'visible':'hidden'; el.setAttribute('aria-hidden',on?'false':'true'); el.inert=!on; }

  function makeWish(){
    if(busy) return; busy=true;
    const t=tNow(); landing=measureLanding(); burst(t);
    const delay=reduced?0:1300;
    setTimeout(()=>{ slide(1,tNow()); show(onbPane,true); track.style.transform='translateX(-50%)'; render(); },delay);
    setTimeout(()=>{ show(heroPane,false); busy=false; const b=document.getElementById('role'); if(b) try{b.focus({preventScroll:true});}catch(e){} },delay+DUR+60);
  }
  function goBack(){
    if(busy) return; busy=true; show(heroPane,true);
    setTimeout(()=>{ const t=tNow(); slide(0,t); regrow(t+500); track.style.transform='translateX(0)'; },30);
    setTimeout(()=>{ show(onbPane,false); busy=false; try{wishBtn.focus({preventScroll:true});}catch(e){} },DUR+120);
  }

  // ---------- flower behaviour ----------
  page.addEventListener('pointermove',e=>{ const x=e.clientX-page.getBoundingClientRect().left; if(mx!=null) gust=clamp(gust+(x-mx)*.005,-1.6,1.6); mx=x; });
  page.addEventListener('pointerleave',()=>{mx=null;});
  wishBtn.addEventListener('click',makeWish);

  function pick(n){
    const c=[]; for(let i=0;i<N;i++){const s=seeds[i]; if(s.gone||s.pend) continue; c.push([rot[i*12]+.3*rot[i*12+2]+Math.random()*.9,i]);}
    c.sort((a,b)=>b[0]-a[0]); const out=[]; for(let j=0;j<Math.min(n,c.length);j++){out.push(c[j][1]); seeds[c[j][1]].pend=true;} return out;
  }
  // every seed bursts outward; one bright seed is held back to guide the way
  function burst(t){

    for(let i=0;i<N;i++){ const s=seeds[i]; if(s.gone) continue; s.pend=true;
      const sc=rot[i*12]*.5+rot[i*12+1]*.6+rot[i*12+2]*.4; if(sc>best){best=sc;gi=i;} }
    for(let i=0;i<N;i++){ if(i===gi||!seeds[i].pend) continue; pending.push({i,at:t+Math.random()*240,kind:'burst'}); }
    if(gi>=0){ seeds[gi].lit=true; seeds[gi].col=0; pending.push({i:gi,at:t+520,kind:'guide'}); }
    gust=Math.min(1.6,gust+1.2);
  }
  function regrow(at){
    explodeAt=reduced?-1e9:at;
    for(const s of seeds){ s.gone=false; s.pend=false; s.born=explodeAt; }
    wished=false; pending=[]; nextAmbient=explodeAt+6000;
    for(const f of free) if(f.guide){ f.guide=false; f.life=f.age+2.2; }
  }
  function detach(i,t,hx,hy,kind){
    const s=seeds[i]; s.pend=false; if(s.gone) return;
    const o=i*12, R=G.R; s.gone=true;
    s.regrow=wished?Infinity:t+9000+Math.random()*6000;
    const d=[rot[o],rot[o+1],rot[o+2]];
    const f={x:hx+d[0]*.1*R, y:hy-d[1]*.1*R, vx:d[0]*70+25, vy:-d[1]*70-10, d, fil:s.fil, len:s.len, open:s.open,
      ph:Math.random()*6.28, age:0, tilt:(Math.random()-.5)*.7, spin:(Math.random()-.5)*.8, col:s.col, emit:0, sc:1,
      rate:0, lit:kind==='guide'||(kind==='burst'&&Math.random()<.13)};
    if(kind==='burst'&&f.lit){ f.rate=2; f.spotK=rnd(1.1,2.6); }
    if(kind==='burst'){ const v=260+Math.random()*480; f.vx=d[0]*v+(Math.random()-.5)*90; f.vy=-d[1]*v+(Math.random()-.5)*90; f.life=1.4+Math.random()*2; }
    if(kind==='guide'){ f.guide=true; if(TH.spots) f.len=.001; f.g0=t; f.g1=t+(reduced?1:780+DUR+300); f.p0=[f.x,f.y]; f.spin=.25; f.rate=26; }

  const spr=(img,x,y,s,a)=>{ if(a<=.01) return; ctx.globalAlpha=a>1?1:a; ctx.drawImage(img,x-s/2,y-s/2,s,s); };

  function drawGrass(list,t,g){
    ctx.fillStyle=list.col; ctx.beginPath();
    for(const b of list){
      const sw=reduced?0:Math.sin(t/1600+b.ph)*.06+g*.05, lx=(b.lean+sw)*b.h, tipx=b.x+lx, tipy=H-b.h;
      ctx.moveTo(b.x-b.w,H+2); ctx.quadraticCurveTo(b.x+lx*.4,H-b.h*.55,tipx,tipy); ctx.quadraticCurveTo(b.x+lx*.4+b.w*.35,H-b.h*.5,b.x+b.w,H+2);

  }
  // fireflies: blink on and off, wander, and sit at three depths
  function drawFlies(layer,t,dt,g){
    ctx.globalCompositeOperation=ADD;
    for(const f of flies){
      if(f.layer!==layer) continue;
      if(!reduced){
        const sp=layer===2?.6:1;
        f.x+=((f.vx+Math.sin(t/1300+f.ph)*12)*sp+g*30)*dt; f.y+=(f.vy+Math.cos(t/1100+f.ph*1.3)*9)*sp*dt;
        if(f.x<-60) f.x=W+60; if(f.x>W+60) f.x=-60; if(f.y<H*.12) f.vy=Math.abs(f.vy); if(f.y>H+40) f.vy=-Math.abs(f.vy)-2;
      }
      let b;
      if(reduced) b=.6;
      else if(layer===2) b=.45+.25*Math.sin(t/1700+f.ph);
      else b=.18+.82*Math.pow(Math.max(0,Math.sin(t/1000/f.per*Math.PI*2+f.ph)),3);
      if(layer===2){ spr(BOKEH[f.c],f.x,f.y,f.s,b*(TH.light?.62:.45)); continue; }

        ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x-(f.vx+g*30)*.5,f.y-f.vy*.5); ctx.stroke();
      }
      spr(FLY[f.c],f.x,f.y,f.s*(.7+.3*b),b);
    }

  }

  // ---------- frame ----------
  function frame(now){
    requestAnimationFrame(frame);
    const t=now-t0, dt=Math.min(.05,Math.max(.001,(now-last)/1000)); last=now;
    const R=G.R;
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    gust*=Math.pow(.3,dt); const g=gust;
    if(sunCv) ctx.drawImage(sunCv,-W*sp(t),0,W,H);
    if(sunPos){
      const px=sunPos.x-W*sp(t), br=reduced?1:.75+.25*Math.sin(t/1800), rr=sunPos.r*(1.9+.15*br);
      const gl=ctx.createRadialGradient(px,sunPos.y,sunPos.r*.95,px,sunPos.y,rr);
      gl.addColorStop(0,`rgba(255,160,80,${(.22*br).toFixed(3)})`); gl.addColorStop(1,'rgba(255,190,110,0)');

    }

    // faint stars, then the distant fireflies
    ctx.fillStyle=`rgb(${TH.dust||'0,0,0'})`;
    for(const s of stars){ ctx.globalAlpha=reduced?.5:.25+.55*Math.pow(.5+.5*Math.sin(t/1000*s.sp+s.ph),3); ctx.fillRect(s.x-s.r/2,s.y-s.r/2,s.r,s.r); }

    const sway=reduced?0:(Math.sin(t/1900)*.03+Math.sin(t/830+1)*.01+g*.05);
    const grow=1, stemIn=reduced?1:clamp(t/900,0,1);
    const headOn=t>=explodeAt, xv=clamp((t-explodeAt)/750,0,1);
    // orb size: a small node while climbing, swells before the burst, overshoots, then settles
    const orbK=.6+.4*ease3(clamp((t-explodeAt)/3000,0,1));
    const headFade=clamp((t-explodeAt)/900,0,1);
    const ay=reduced?.5:.5+t*.00005, ax=-.22;
    const cya=Math.cos(ay),sya=Math.sin(ay),cxa=Math.cos(ax),sxa=Math.sin(ax),cs=Math.cos(sway),ss=Math.sin(sway);
    const ox=-W*sp(t), bx=G.cx+ox, by=G.by, Ls=by-G.cy, fx=bx+Math.sin(sway)*Ls, fy=by-Math.cos(sway)*Ls;

        ctx.globalCompositeOperation='source-over'; }

      ctx.save(); ctx.translate(-R*.008,0); stemPath(); ctx.strokeStyle=`rgba(${TH.stem.rim},${(TH.stem.rimA*stemIn).toFixed(3)})`; ctx.lineWidth=1.2; ctx.stroke(); ctx.restore();
    }

    // sphere rotation + bloom state
    const R3=(x,y,z,o)=>{const x1=x*cya+z*sya,z1=-x*sya+z*cya,y1=y*cxa-z1*sxa,z2=y*sxa+z1*cxa; rot[o]=x1*cs+y1*ss; rot[o+1]=-x1*ss+y1*cs; rot[o+2]=z2;};

      hubX[i]=tx; hubY[i]=ty; hubE[i]=e;
      const C=(.12+.95*e)*s.open, cc=Math.cos(C), sc=Math.sin(C), L=.36*s.len*(.25+.75*e)*R;
      const ux=rot[o+3],uy=rot[o+4],vx=rot[o+6],vy=rot[o+7],px=rot[o+9],py=rot[o+10],f=s.fil,sz=rot[o+2];

      og.addColorStop(0,`rgba(${TH.orb[0]},${Math.min(1,.55*swellGlow).toFixed(3)})`); og.addColorStop(.25,`rgba(${TH.orb[1]},.22)`); og.addColorStop(1,`rgba(${TH.orb[1]},0)`);

    </div>`);
    const mk=(host,vals,key)=>vals.forEach(v=>{ const c=el(`<button type="button" class="chip" aria-pressed="${S[key]===v}">${esc(v)}</button>`);
      c.addEventListener('click',()=>{ S[key]=v; host.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false')); c.setAttribute('aria-pressed','true'); n.querySelector('#book').disabled=!(S.callDay&&S.callTime); }); host.appendChild(c); });
    mk(n.querySelector('#days'),days,'callDay'); mk(n.querySelector('#times'),['09:30','11:00','14:30','16:00'],'callTime');
    n.querySelector('#book').addEventListener('click',()=>{ S.booked=true; render(); });
    const pk=n.querySelector('#pkg'); if(pk) pk.addEventListener('click',()=>{ S.talk=false; render(); });
    return n;
  }

  document.getElementById('back').addEventListener('click',()=>{
    if(S.step>1){ S.talk=false; S.planted=false; S.booked=false; go(S.step-1); }
    else goBack();
  });

  render();
  resize();
  let rz; if(window.ResizeObserver) new ResizeObserver(()=>{clearTimeout(rz); rz=setTimeout(resize,120);}).observe(page);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
